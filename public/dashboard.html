<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Dashboard - StudyForge</title>
<meta name="description" content="Dashboard belajar interaktif StudyForge."/>
<link rel="stylesheet" href="/css/style.css?v=2.3"/>
</head>
<body class="dashboard-page">

<div class="app-layout">
  <!-- MOBILE HEADER -->
  <div class="mobile-app-header">
    <a href="/" class="mobile-app-logo">⚡ StudyForge</a>
    <button class="mobile-hamburger" id="mobileMenuBtn">☰</button>
  </div>

  <!-- SIDEBAR -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-header">
      <h2>⚡ StudyForge</h2>
      <p>Platform Try Out Cerdas</p>
    </div>
    <div class="sidebar-nav">
      <a href="/paket-soal" class="sidebar-btn active">📚 Paket Soal</a>
      <a href="/koleksi" class="sidebar-btn" id="navPrivate">🔒 Koleksi Pribadi</a>
      <a href="/insight" class="sidebar-btn">🧠 Insight Belajar</a>
      <a href="/riwayat" class="sidebar-btn">🕒 Riwayat Ujian</a>
      <a href="/creator" class="sidebar-btn">✨ Creator Studio</a>
      <a href="/admin" class="sidebar-btn" id="navAdmin" style="display:none; color:var(--accent);">⚙️ Admin Panel</a>
      
      <div style="flex:1;"></div>
      <a href="#" onclick="logoutUser(); return false;" class="sidebar-btn" style="color:var(--text3); border-top:1px solid var(--border); border-radius:0; padding-top:1rem; margin-top:1rem;">🚪 Keluar</a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="app-main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 id="pageTitle" style="font-size:1.8rem; font-weight:800; margin-bottom:0.2rem;">Paket Soal Tersedia</h1>
        <p id="pageDesc" style="color:var(--text2); font-size:0.95rem;">Telusuri koleksi try out dan latihan yang siap dikerjakan.</p>
      </div>
      <a href="/creator" class="btn btn-primary" id="btnCreateQuiz" style="display:none; background: linear-gradient(135deg, var(--primary), var(--accent));">✨ Bikin Soal Sendiri</a>
    </div>

    <!-- SEARCH & FILTER -->
    <div style="margin-bottom:2rem; max-width:500px;">
      <input class="form-input" id="searchInput" placeholder="🔍 Cari judul atau kategori soal..." style="width:100%;" oninput="filterQuizzes()"/>
    </div>

    <!-- GRID CARDS -->
    <div id="quizGrid" class="cards-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
      <div style="grid-column:1/-1;text-align:center;padding:4rem;color:var(--text3);">
        <div class="loader" style="margin:0 auto 1rem;width:32px;height:32px;border-width:3px;"></div>
        <p>Memuat paket soal...</p>
      </div>
    </div>
  </main>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/core/site-config.js"></script>
<script src="/js/core/auth.js"></script>
<script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
